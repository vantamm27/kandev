name: Fleet Tests

on:
  push:
    branches: [main, 'feature/fleet']
    paths:
      - 'apps/fleet/**'
      - 'apps/backend/pkg/pluginsdk/**'
      - '.github/workflows/fleet-tests.yml'
  pull_request:
    paths:
      - 'apps/fleet/**'
      - '.github/workflows/fleet-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fleet
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0
        with:
          go-version-file: apps/fleet/go.mod
          cache-dependency-path: apps/fleet/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet -trimpath ./...
      - name: Test
        run: go test -trimpath -race -timeout 5m ./...
      - name: Build
        run: go build -trimpath ./...
      - name: Cross-build fleet-agent without cgo
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/fleet-agent
          done

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fleet/kandev-plugin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0
        with:
          go-version-file: apps/fleet/kandev-plugin/go.mod
          cache-dependency-path: apps/fleet/kandev-plugin/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check the UI bundle parses
        run: node --check ui/bundle.js
      - name: Vet
        run: go vet -trimpath ./...
      - name: Test (includes plugin-pack and Kandev's installer)
        run: go test -trimpath -race -timeout 5m ./...
